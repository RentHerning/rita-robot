name = "rita-robot"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Workers AI (gratis kvote dækker lav trafik)
[ai]
binding = "AI"

# rita.js og demo.html
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/health"]

[vars]
# Domæner der må bruge chatten, adskilt med komma. rentherning.github.io er demoen af den nye
# hjemmeside, localhost:5173 er dens lokale udviklingsserver.
ALLOWED_ORIGINS = "https://rentherning.dk,https://www.rentherning.dk,https://rentherning.github.io,https://rita-robot.philip15.workers.dev,http://localhost:8787,http://localhost:5173"
MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# Tillad lokale testsider (http://localhost:* og http://127.0.0.1:*). Sæt til "false" i produktion.
ALLOW_LOCALHOST = "false"

# Skift til en anden sprogmodel senere (fx Claude eller en dansk model på Hugging Face):
# LLM_PROVIDER = "openai-compatible"
# LLM_BASE_URL = "https://api.anthropic.com/v1"
# LLM_MODEL    = "claude-haiku-4-5"
# ... og sæt nøglen som secret:  npx wrangler secret put LLM_API_KEY

# Max antal spørgsmål pr. døgn for alle besøgende tilsammen (beskytter AI-kvoten).
# Kræver KV-navnerummet RITA_LIMITS nedenfor; uden det tælles der ikke.
DAILY_LIMIT = "500"

# Rate limiting, lag 1: max 10 beskeder pr. minut pr. IP (Cloudflare tæller, Rita gemmer intet)
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Rate limiting, lag 2: dagligt loft for alle tilsammen (én tæller pr. dag, ingen IP-adresser).
# Oprettet med:  npx wrangler kv namespace create RITA_LIMITS  (konto Philip15@live.dk)
[[kv_namespaces]]
binding = "RITA_LIMITS"
id = "5102b3457fb94f248ae89b8d6075d6c7"
