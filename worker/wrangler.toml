name = "rita-robot"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Workers AI (gratis kvote dækker lav trafik)
[ai]
binding = "AI"

# rita.js og demo.html
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/health"]

[vars]
# Domæner der må bruge chatten. Tilføj evt. test-domæner, adskilt med komma.
ALLOWED_ORIGINS = "https://rentherning.dk,https://www.rentherning.dk,https://rita-robot.philip15.workers.dev,http://localhost:8787"
MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# Skift til en anden sprogmodel senere (fx Claude eller en dansk model på Hugging Face):
# LLM_PROVIDER = "openai-compatible"
# LLM_BASE_URL = "https://api.anthropic.com/v1"
# LLM_MODEL    = "claude-haiku-4-5"
# ... og sæt nøglen som secret:  npx wrangler secret put LLM_API_KEY

# Simpel beskyttelse mod misbrug: 20 beskeder pr. minut pr. IP
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
